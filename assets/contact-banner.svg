<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 240" role="img" aria-label="Direct Touchpoints and Collaboration Call-to-Action">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813"/>
      <stop offset="50%" stop-color="#0e1329"/>
      <stop offset="100%" stop-color="#140f2b"/>
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="ctaBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #f43f5e; #38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #f43f5e; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #f43f5e; #38bdf8; #818cf8; #c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="ctaRadial" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Fira Code', Consolas, monospace; }

      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.9); opacity: 0.4; }
      }
      .beacon { animation: pulseBeacon 2s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="240" rx="18" fill="url(#ctaBg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#ctaRadial)"/>
  <rect x="1.5" y="1.5" width="1197" height="237" rx="17" fill="none" stroke="url(#ctaBorder)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ==================== HEADER ROW ==================== -->
  <g transform="translate(0, 36)" text-anchor="middle">
    <!-- Live Availability Beacon -->
    <g transform="translate(600, 0)">
      <rect x="-190" y="0" width="380" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="-168" cy="14" r="5" fill="#22c55e" class="beacon"/>
      <circle cx="-168" cy="14" r="2.5" fill="#bbf7d0"/>
      <text x="-152" y="18" fill="#e0f2fe" class="font-sans" font-size="11" font-weight="700" letter-spacing="1" text-anchor="start">
        OPEN FOR LEADERSHIP ROLES &amp; CONSULTING
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="66" fill="#ffffff" class="font-sans" font-size="28" font-weight="800" letter-spacing="-0.5">
      Let&#8217;s Build <tspan fill="#38bdf8">Zero-Defect</tspan> Enterprise Software Together
    </text>

    <!-- Subtitle -->
    <text x="600" y="94" fill="#94a3b8" class="font-sans" font-size="14">
      Direct senior engineering engagement • Zero junior handoffs • Full IP ownership &amp; 99.99% SLA
    </text>
  </g>

  <!-- ==================== 4 ACTION PILLS ==================== -->
  <g transform="translate(68, 150)">
    
    <!-- Button 1: Discovery Call -->
    <g transform="translate(0, 0)">
      <rect width="250" height="52" rx="12" fill="#064e3b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.3"/>
      <text x="32" y="32" fill="#34d399" class="font-sans" font-size="16">📅</text>
      <text x="58" y="26" fill="#ecfdf5" class="font-sans" font-size="12.5" font-weight="700">Schedule Discovery Call</text>
      <text x="58" y="42" fill="#a7f3d0" class="font-mono" font-size="10.5">codex404solutions.online</text>
    </g>

    <!-- Button 2: WhatsApp Direct -->
    <g transform="translate(272, 0)">
      <rect width="250" height="52" rx="12" fill="#064e3b" fill-opacity="0.8" stroke="#22c55e" stroke-opacity="0.7" stroke-width="1.3"/>
      <text x="32" y="32" fill="#22c55e" class="font-sans" font-size="16">💬</text>
      <text x="58" y="26" fill="#f0fdf4" class="font-sans" font-size="12.5" font-weight="700">WhatsApp Direct Chat</text>
      <text x="58" y="42" fill="#86efac" class="font-mono" font-size="10.5">+91 77177 47620</text>
    </g>

    <!-- Button 3: LinkedIn Profile -->
    <g transform="translate(544, 0)">
      <rect width="250" height="52" rx="12" fill="#0c4a6e" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.3"/>
      <text x="32" y="32" fill="#38bdf8" class="font-sans" font-size="16">💼</text>
      <text x="58" y="26" fill="#f0f9ff" class="font-sans" font-size="12.5" font-weight="700">LinkedIn Connect</text>
      <text x="58" y="42" fill="#7dd3fc" class="font-mono" font-size="10.5">linkedin.com/in/mnoukhej</text>
    </g>

    <!-- Button 4: Direct Email -->
    <g transform="translate(816, 0)">
      <rect width="250" height="52" rx="12" fill="#312e81" fill-opacity="0.8" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.3"/>
      <text x="32" y="32" fill="#818cf8" class="font-sans" font-size="16">✉️</text>
      <text x="58" y="26" fill="#eef2ff" class="font-sans" font-size="12.5" font-weight="700">Send Formal Inquiry</text>
      <text x="58" y="42" fill="#c7d2fe" class="font-mono" font-size="10.5">contact@codex404solutions</text>
    </g>

  </g>

</svg>
