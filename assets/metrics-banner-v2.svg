<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="130" viewBox="0 0 1200 130" role="img" aria-label="Animated Metrics &amp; Enterprise Pedigree Showcase">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#0b081e"/>
    </linearGradient>

    <!-- Card Glow Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281140"/>
      <stop offset="100%" stop-color="#120824"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08291f"/>
      <stop offset="100%" stop-color="#041410"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#330e18"/>
      <stop offset="100%" stop-color="#17060b"/>
    </linearGradient>

    <!-- Edge Overlays (Safe Fade without buggy luminance masks) -->
    <linearGradient id="metricLeftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040711" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="metricRightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040711" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="metricsClip">
      <rect x="0" y="0" width="1200" height="130" rx="16"/>
    </clipPath>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Fira Code', Consolas, monospace; }

      @keyframes slideMetrics {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1560px); }
      }

      .metrics-track {
        animation: slideMetrics 30s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="130" rx="16" fill="url(#metricBg)"/>
  <rect x="1" y="1" width="1198" height="128" rx="15" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2"/>

  <!-- Motion Track with Safe ClipPath -->
  <g clip-path="url(#metricsClip)">
    <g class="metrics-track">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -1560 0"
        dur="30s"
        repeatCount="indefinite"
      />

      <!-- ==================== LOOP 1 (Total Width: 1560px) ==================== -->
      <g transform="translate(10, 16)">
        
        <!-- CARD 1: 7+ Years TCS RnI -->
        <g transform="translate(0, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#38bdf8" class="font-sans" font-size="24" font-weight="800">7+ Years</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">TCS Enterprise Tenure</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">RnI &amp; RnD AI/Python Architect</text>
        </g>

        <!-- CARD 2: Zero Bugs Guarantee -->
        <g transform="translate(310, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad4)" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#f43f5e" class="font-sans" font-size="24" font-weight="800">0 Bugs Guarantee</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Deterministic Engineering</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Where Bugs Meet Their Match</text>
        </g>

        <!-- CARD 3: Founder & CEO @ CodeX404 -->
        <g transform="translate(620, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad2)" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#c084fc" class="font-sans" font-size="24" font-weight="800">CodeX404 Solutions</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Founder &amp; Chief Executive</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Senior Direct Client Engineering</text>
        </g>

        <!-- CARD 4: 99.99% SLA & Zero Downtime -->
        <g transform="translate(930, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad3)" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#34d399" class="font-sans" font-size="24" font-weight="800">99.99% SLA</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Zero-Downtime Reliability</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Resilient Cloud Microservices</text>
        </g>

        <!-- CARD 5: 25k+ Real-time Traffic -->
        <g transform="translate(1240, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#38bdf8" class="font-sans" font-size="24" font-weight="800">25,000+ Visits</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Peak Production Traffic</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Insan Degree College Portal</text>
        </g>

      </g>

      <!-- ==================== LOOP 2 (Exact Duplicate at 1560px for Infinite Flow) ==================== -->
      <g transform="translate(1570, 16)">
        
        <!-- CARD 1: 7+ Years TCS RnI -->
        <g transform="translate(0, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#38bdf8" class="font-sans" font-size="24" font-weight="800">7+ Years</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">TCS Enterprise Tenure</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">RnI &amp; RnD AI/Python Architect</text>
        </g>

        <!-- CARD 2: Zero Bugs Guarantee -->
        <g transform="translate(310, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad4)" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#f43f5e" class="font-sans" font-size="24" font-weight="800">0 Bugs Guarantee</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Deterministic Engineering</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Where Bugs Meet Their Match</text>
        </g>

        <!-- CARD 3: Founder & CEO @ CodeX404 -->
        <g transform="translate(620, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad2)" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#c084fc" class="font-sans" font-size="24" font-weight="800">CodeX404 Solutions</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Founder &amp; Chief Executive</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Senior Direct Client Engineering</text>
        </g>

        <!-- CARD 4: 99.99% SLA & Zero Downtime -->
        <g transform="translate(930, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad3)" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#34d399" class="font-sans" font-size="24" font-weight="800">99.99% SLA</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Zero-Downtime Reliability</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Resilient Cloud Microservices</text>
        </g>

        <!-- CARD 5: 25k+ Real-time Traffic -->
        <g transform="translate(1240, 0)">
          <rect width="280" height="96" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.3"/>
          <text x="18" y="34" fill="#38bdf8" class="font-sans" font-size="24" font-weight="800">25,000+ Visits</text>
          <text x="18" y="58" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Peak Production Traffic</text>
          <text x="18" y="78" fill="#94a3b8" class="font-sans" font-size="11.5">Insan Degree College Portal</text>
        </g>

      </g>
    </g>
  </g>

  <!-- Safe Edge Fade Overlays -->
  <rect x="0" y="0" width="60" height="130" rx="16" fill="url(#metricLeftFade)" pointer-events="none"/>
  <rect x="1140" y="0" width="60" height="130" rx="16" fill="url(#metricRightFade)" pointer-events="none"/>
</svg>
