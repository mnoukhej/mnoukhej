    <text x="12" y="20.5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      💼 <tspan fill="#38bdf8" font-weight="700">7+ Years</tspan> Enterprise (TCS RnI)
    </text>

    <!-- CodeX404 Badge -->
    <rect x="237" y="0" width="215" height="32" rx="7" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-opacity="0.6"/>
    <text x="249" y="20.5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
