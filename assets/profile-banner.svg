<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Noukhez — Python, AI and software</title>
  <desc id="desc">A dark navy technology banner with a glowing blue-violet gradient, abstract connected nodes, and a terminal-inspired monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".58" stop-color="#111a32"/>
      <stop offset="1" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d8fb"/>
      <stop offset=".52" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#b28dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(940 174) rotate(90) scale(240 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#766cff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#766cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a7b7ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="26" fill="url(#glow)"/>
  <path d="M24 1h1152a24 24 0 0 1 24 24v291a24 24 0 0 1-24 24H24A24 24 0 0 1 0 316V25A24 24 0 0 1 24 1Z" fill="none" stroke="#8ca0ff" stroke-opacity=".2"/>
