  <circle cx="91" cy="69.5" r="4" fill="#55d8fb"/>
  <text x="106" y="74" fill="#b9c8f4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.9">SOFTWARE · AI · AUTOMATION</text>
  <text x="68" y="157" fill="#f4f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.7">Muhammad</text>
  <text x="68" y="223" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Noukhez</text>
  <rect x="72" y="253" width="44" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="128" y="259" fill="#a9b6d5" font-family="Segoe UI, Arial, sans-serif" font-size="16">Building useful things with Python and machine learning.</text>
