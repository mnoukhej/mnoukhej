    <text x="13" y="17" fill="#7dd3fc" font-family="Consolas, monospace" font-size="11.5" font-weight="600">Python</text>

    <!-- FastAPI -->
    <rect x="84" y="0" width="80" height="26" rx="13" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="98" y="17" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11.5" font-weight="600">FastAPI</text>

    <!-- Azure OpenAI -->
    <rect x="172" y="0" width="116" height="26" rx="13" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="184" y="17" fill="#a5b4fc" font-family="Consolas, monospace" font-size="11.5" font-weight="600">Azure OpenAI</text>

    <!-- PyTorch -->
    <rect x="296" y="0" width="82" height="26" rx="13" fill="#9f1239" fill-opacity="0.25" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="310" y="17" fill="#fda4af" font-family="Consolas, monospace" font-size="11.5" font-weight="600">PyTorch</text>

    <!-- React -->
    <rect x="386" y="0" width="72" height="26" rx="13" fill="#0e7490" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="400" y="17" fill="#67e8f9" font-family="Consolas, monospace" font-size="11.5" font-weight="600">React</text>

    <!-- Docker -->
    <rect x="466" y="0" width="78" height="26" rx="13" fill="#1e3a8a" fill-opacity="0.25" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="479" y="17" fill="#93c5fd" font-family="Consolas, monospace" font-size="11.5" font-weight="600">Docker</text>
  </g>

  <!-- Location & Availability Footnote -->
  <text x="56" y="278" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    📍 Kolkata, India &#160;•&#160; 🌐 Available Worldwide &#160;•&#160; ⚡ Open to Senior AI &amp; Python Roles
  </text>


  <!-- ==================== RIGHT COLUMN (Strictly X=690..1144, CANNOT OVERLAP) ==================== -->

  <!-- Terminal Window Background -->
  <rect x="690" y="32" width="454" height="256" rx="14" fill="#0b0f1a" fill-opacity="0.92" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Titlebar -->
  <path d="M 690 46 C 690 38.26 696.26 32 704 32 L 1130 32 C 1137.73 32 1144 38.26 1144 46 L 1144 68 L 690 68 Z" fill="#060911" fill-opacity="0.95"/>
  <line x1="690" y1="68" x2="1144" y2="68" stroke="#334155" stroke-opacity="0.5"/>

  <!-- Window Dots -->
  <circle cx="712" cy="50" r="5" fill="#ef4444"/>
  <circle cx="728" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="744" cy="50" r="5" fill="#10b981"/>

  <!-- Tab Title -->
  <text x="917" y="54" fill="#64748b" font-family="Consolas, monospace" font-size="11" text-anchor="middle">architect@noukhez: ~/profile.py</text>

  <!-- Code Body (Fixed X coordinates) -->
  <text x="714" y="96" fill="#64748b" font-family="'Fira Code', Consolas, monospace" font-size="12"># Enterprise AI &amp; Python Architect</text>
  
  <text x="714" y="118" fill="#f472b6" font-family="'Fira Code', Consolas, monospace" font-size="12.5" font-weight="600">class <tspan fill="#38bdf8">MuhammadNoukhez</tspan>:</text>
  
  <text x="734" y="140" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="12">role&#160;&#160;&#160;&#160;&#160;&#160;&#160;= <tspan fill="#a5b4fc">"Senior AI &amp; Python Engineer"</tspan></text>
  <text x="734" y="162" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="12">enterprise&#160;= <tspan fill="#38bdf8">"7+ Years (TCS RnI &amp; RnD)"</tspan></text>
  <text x="734" y="184" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="12">venture&#160;&#160;&#160;&#160;&#160;= <tspan fill="#c084fc">"Founder @ CodeX404 Solutions"</tspan></text>
  <text x="734" y="206" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="12">core_stack&#160;= [<tspan fill="#34d399">"FastAPI"</tspan>, <tspan fill="#34d399">"Azure OpenAI"</tspan>, <tspan fill="#34d399">"React"</tspan>]</text>
  <text x="734" y="228" fill="#94a3b8" font-family="'Fira Code', Consolas, monospace" font-size="12">mission&#160;&#160;&#160;&#160;= <tspan fill="#facc15">"Building resilient scalable AI"</tspan></text>

  <!-- Prompt line -->
  <text x="714" y="260" fill="#38bdf8" font-family="'Fira Code', Consolas, monospace" font-size="12">&gt;&gt;&gt;&#160;</text>
  <text x="746" y="260" fill="#e2e8f0" font-family="'Fira Code', Consolas, monospace" font-size="12">noukhez.build_future()</text>
  <rect x="918" y="249" width="8" height="14" fill="#38bdf8" class="cursor-blink"/>

</svg>