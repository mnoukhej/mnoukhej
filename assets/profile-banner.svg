<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Noukhez — Senior Python Developer &amp; GenAI / ML Engineer</title>
  <desc id="desc">High-tech developer banner featuring Muhammad Noukhez, Senior Python &amp; GenAI Architect with 7+ years enterprise experience.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#14102b"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Text Shimmer -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="leftAmbient" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightAmbient" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#6366f1" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="36" cy="36" r="1.2" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <style>
      @keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor-blink { animation: blink 1.1s infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="20" fill="url(#canvasBg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#gridPattern)"/>
  <rect width="1200" height="320" rx="20" fill="url(#leftAmbient)"/>
  <rect width="1200" height="320" rx="20" fill="url(#rightAmbient)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="url(#neonGradient)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN (Explicit X coords: 56..640) ==================== -->

  <!-- Top Pill -->
  <rect x="56" y="36" width="365" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="72" cy="50" r="4" fill="#22c55e"/>
  <text x="86" y="54" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SENIOR PYTHON DEVELOPER &amp; GENAI ARCHITECT</text>

  <!-- Name Title -->
  <text x="56" y="112" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Muhammad <tspan fill="url(#neonGradient)">Noukhez</tspan>
  </text>

  <!-- Subtitle -->
  <text x="56" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
