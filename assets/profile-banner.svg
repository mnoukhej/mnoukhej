    <rect width="342" height="236" rx="18" fill="#0a1020" fill-opacity=".78" stroke="#94a6ff" stroke-opacity=".28"/>
    <path d="M0 47h342" stroke="#94a6ff" stroke-opacity=".2"/>
    <circle cx="24" cy="24" r="5" fill="#ff7b83"/>
    <circle cx="43" cy="24" r="5" fill="#ffd166"/>
    <circle cx="62" cy="24" r="5" fill="#65d69a"/>
    <text x="26" y="91" fill="#7d8dae" font-family="Consolas, monospace" font-size="15">$</text>
    <text x="50" y="91" fill="#69d8fa" font-family="Consolas, monospace" font-size="15">python</text>
    <text x="26" y="127" fill="#b6c4e5" font-family="Consolas, monospace" font-size="15">build(</text>
    <text x="89" y="127" fill="#c6a5ff" font-family="Consolas, monospace" font-size="15">ideas</text>
    <text x="142" y="127" fill="#b6c4e5" font-family="Consolas, monospace" font-size="15">, with=</text>
