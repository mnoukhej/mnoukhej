<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Noukhez — Senior Python Developer &amp; GenAI / ML Engineer</title>
  <desc id="desc">Futuristic banner with neon glow, glassmorphism terminal, tech chips, and verified experience.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="45%" stop-color="#0c1222"/>
      <stop offset="85%" stop-color="#140f2d"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>

    <!-- Neon Glow Accents -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Isometric Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Filter for subtle drop-shadow -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>

    <style>
      @keyframes cursorBlink {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.7)); }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .cursor { animation: cursorBlink 1s infinite; }
      .glowing-badge { animation: pulseGlow 4s ease-in-out infinite; }
      .floating-terminal { animation: floatSoft 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="24" fill="url(#cyberGrid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowLeft)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowRight)"/>

  <!-- Outer Neon Border Stroke -->
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#accentGradient)" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Left Content Group -->
  <g transform="translate(64, 44)">
    <!-- Status / Role Pill -->
    <g class="glowing-badge">
      <rect x="0" y="0" width="375" height="32" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#22c55e"/>
      <circle cx="16" cy="16" r="8" fill="#22c55e" fill-opacity="0.25"/>
      <text x="32" y="20.5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">SENIOR PYTHON DEVELOPER &amp; GENAI ARCHITECT</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="96" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">
      Muhammad <tspan fill="url(#accentGradient)">Noukhez</tspan>
    </text>

    <!-- Tagline Subtitle -->
    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Building Enterprise AI Systems, High-Performance APIs &amp; Scalable Web Architectures
    </text>

    <!-- Enterprise Experience Highlights Row -->
    <g transform="translate(0, 160)">
      <!-- Experience Tag -->
      <rect x="0" y="0" width="232" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-opacity="0.5"/>
      <text x="12" y="21.5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        💼 <tspan fill="#38bdf8" font-weight="700">7+ Years</tspan> Enterprise (TCS RnI)
      </text>

      <!-- Founder Tag -->
      <rect x="244" y="0" width="220" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-opacity="0.5"/>
      <text x="256" y="21.5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
        🚀 Founder @ <tspan fill="#c084fc" font-weight="700">CodeX404 Solutions</tspan>
      </text>
    </g>

    <!-- Tech Stacks Pills Row -->
    <g transform="translate(0, 212)">
      <!-- Python -->
      <rect x="0" y="0" width="84" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="14" y="18" fill="#7dd3fc" font-family="Consolas, monospace" font-size="12" font-weight="600">Python</text>

      <!-- FastAPI -->
      <rect x="92" y="0" width="86" height="28" rx="14" fill="#047857" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="106" y="18" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="600">FastAPI</text>

      <!-- Azure OpenAI -->
      <rect x="186" y="0" width="124" height="28" rx="14" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="198" y="18" fill="#a5b4fc" font-family="Consolas, monospace" font-size="12" font-weight="600">Azure OpenAI</text>

      <!-- PyTorch & YOLO -->
      <rect x="318" y="0" width="138" height="28" rx="14" fill="#701a75" fill-opacity="0.25" stroke="#e879f9" stroke-opacity="0.5"/>
      <text x="330" y="18" fill="#f0abfc" font-family="Consolas, monospace" font-size="12" font-weight="600">PyTorch • YOLO</text>

      <!-- Full Stack -->
      <rect x="464" y="0" width="112" height="28" rx="14" fill="#831843" fill-opacity="0.25" stroke="#f472b6" stroke-opacity="0.5"/>
      <text x="476" y="18" fill="#fbcfe8" font-family="Consolas, monospace" font-size="12" font-weight="600">React • Node</text>
    </g>

    <!-- Location & Open Status -->
    <text x="0" y="268" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
      📍 Kolkata, India  •  🌐 Open Worldwide  •  🤝 Contract &amp; Full-Time Opportunities
    </text>
  </g>

  <!-- Right Futuristic Terminal Window -->
  <g class="floating-terminal" transform="translate(740, 36)" filter="url(#neonShadow)">
    <!-- Terminal Body -->
    <rect width="396" height="288" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Terminal Titlebar -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L380 0 C388.84 0 396 7.16 396 16 L396 40 L0 40 Z" fill="#090d16" fill-opacity="0.9"/>
    <line x1="0" y1="40" x2="396" y2="40" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Mac Window Control Dots -->
    <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5.5" fill="#f59e0b"/>
    <circle cx="58" cy="20" r="5.5" fill="#10b981"/>

    <!-- Terminal Title -->
    <text x="198" y="24" fill="#64748b" font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">noukhez@architect: ~ (python3.11)</text>

    <!-- Terminal Code Lines -->
    <g transform="translate(20, 58)" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="12" line-height="1.5">
      <!-- Line 1 -->
      <text y="14" fill="#64748b"># Developer Profile Schema</text>

      <!-- Line 2 -->
      <text y="36" fill="#f472b6">class <tspan fill="#38bdf8">MuhammadNoukhez</tspan>:</text>

      <!-- Line 3 -->
      <text y="58" fill="#cbd5e1">&#160;&#160;role&#160;&#160;&#160;&#160;&#160;&#160;= <tspan fill="#a5b4fc">"Senior AI &amp; Python Engineer"</tspan></text>

      <!-- Line 4 -->
      <text y="80" fill="#cbd5e1">&#160;&#160;enterprise = <tspan fill="#38bdf8">"7+ Yrs @ TCS RnI &amp; RnD"</tspan></text>

      <!-- Line 5 -->
      <text y="102" fill="#cbd5e1">&#160;&#160;venture&#160;&#160;&#160;&#160;= <tspan fill="#f472b6">"Founder @ CodeX404"</tspan></text>

      <!-- Line 6 -->
      <text y="124" fill="#cbd5e1">&#160;&#160;domains&#160;&#160;&#160;&#160;= [</text>
      <text y="144" fill="#34d399">&#160;&#160;&#160;&#160;"FastAPI", "GenAI / RAG", "LLMs",</text>
      <text y="164" fill="#34d399">&#160;&#160;&#160;&#160;"React", "Microservices", "Docker"</text>
      <text y="184" fill="#cbd5e1">&#160;&#160;]</text>

      <!-- Line 7 -->
      <text y="206" fill="#cbd5e1">&#160;&#160;status&#160;&#160;&#160;&#160;&#160;= <tspan fill="#22c55e">"Ready to Deploy &amp; Scale"</tspan></text>

      <!-- Line 8 with Blinking Cursor -->
      <g transform="translate(0, 222)">
        <text y="0" fill="#38bdf8">&gt;&gt;&gt;&#160;</text>
        <text x="36" y="0" fill="#e2e8f0">noukhez.innovate()</text>
        <rect x="188" y="-12" width="8" height="15" fill="#38bdf8" class="cursor"/>
      </g>
    </g>
  </g>
</svg>