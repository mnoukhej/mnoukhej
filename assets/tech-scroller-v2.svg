<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="72" viewBox="0 0 1200 72" role="img" aria-label="Animated Tech Stack Infinite Scroller">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="scrollerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0c1224"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Edge Overlays (Safe Fade without buggy luminance masks) -->
    <linearGradient id="edgeLeftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050814" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edgeRightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050814" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </linearGradient>

    <!-- Clip Path to maintain container border radius -->
    <clipPath id="scrollerClip">
      <rect x="0" y="0" width="1200" height="72" rx="14"/>
    </clipPath>

    <style>
      .font-tech { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace; }

      @keyframes endlessScroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1400px); }
      }

      .scroller-track {
        animation: endlessScroll 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="72" rx="14" fill="url(#scrollerBg)"/>
  <rect x="1" y="1" width="1198" height="70" rx="13" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Content Group Clipped to Container -->
  <g clip-path="url(#scrollerClip)">
    <g class="scroller-track">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -1400 0"
        dur="25s"
        repeatCount="indefinite"
      />

      <!-- ==================== TRACK 1 (Length: 1400px) ==================== -->
      <g id="track1" transform="translate(0, 18)">
        <!-- Python -->
        <g transform="translate(10, 0)">
          <rect width="105" height="36" rx="18" fill="#0f1f38" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
          <text x="32" y="23" fill="#bae6fd" class="font-tech" font-size="12.5" font-weight="700">Python 3.12</text>
        </g>

        <!-- Azure OpenAI -->
        <g transform="translate(130, 0)">
          <rect width="135" height="36" rx="18" fill="#171e3b" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#818cf8"/>
          <text x="32" y="23" fill="#c7d2fe" class="font-tech" font-size="12.5" font-weight="700">Azure OpenAI</text>
        </g>

        <!-- FastAPI -->
        <g transform="translate(280, 0)">
          <rect width="95" height="36" rx="18" fill="#062e24" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#34d399"/>
          <text x="32" y="23" fill="#a7f3d0" class="font-tech" font-size="12.5" font-weight="700">FastAPI</text>
        </g>

        <!-- RAG & Agents -->
        <g transform="translate(390, 0)">
          <rect width="138" height="36" rx="18" fill="#2d133b" stroke="#e879f9" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#e879f9"/>
          <text x="32" y="23" fill="#f5d0fe" class="font-tech" font-size="12.5" font-weight="700">RAG &amp; Agents</text>
        </g>

        <!-- Qdrant Vector DB -->
        <g transform="translate(543, 0)">
          <rect width="128" height="36" rx="18" fill="#31131a" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#f43f5e"/>
          <text x="32" y="23" fill="#fecdd3" class="font-tech" font-size="12.5" font-weight="700">Qdrant DB</text>
        </g>

        <!-- PyTorch -->
        <g transform="translate(686, 0)">
          <rect width="98" height="36" rx="18" fill="#331811" stroke="#fb923c" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#fb923c"/>
          <text x="32" y="23" fill="#ffedd5" class="font-tech" font-size="12.5" font-weight="700">PyTorch</text>
        </g>

        <!-- Docker -->
        <g transform="translate(799, 0)">
          <rect width="92" height="36" rx="18" fill="#0f243d" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#60a5fa"/>
          <text x="32" y="23" fill="#bfdbfe" class="font-tech" font-size="12.5" font-weight="700">Docker</text>
        </g>

        <!-- React.js -->
        <g transform="translate(906, 0)">
          <rect width="98" height="36" rx="18" fill="#082b36" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#22d3ee"/>
          <text x="32" y="23" fill="#cffafe" class="font-tech" font-size="12.5" font-weight="700">React.js</text>
        </g>

        <!-- PostgreSQL -->
        <g transform="translate(1019, 0)">
          <rect width="118" height="36" rx="18" fill="#132338" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
          <text x="32" y="23" fill="#bae6fd" class="font-tech" font-size="12.5" font-weight="700">PostgreSQL</text>
        </g>

        <!-- Redis -->
        <g transform="translate(1152, 0)">
          <rect width="84" height="36" rx="18" fill="#341214" stroke="#ef4444" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
          <text x="32" y="23" fill="#fee2e2" class="font-tech" font-size="12.5" font-weight="700">Redis</text>
        </g>

        <!-- LangChain -->
        <g transform="translate(1251, 0)">
          <rect width="112" height="36" rx="18" fill="#0d2b24" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#10b981"/>
          <text x="32" y="23" fill="#d1fae5" class="font-tech" font-size="12.5" font-weight="700">LangChain</text>
        </g>
      </g>

      <!-- ==================== TRACK 2 (Exact Duplicate for Seamless Infinite Loop at 1400px) ==================== -->
      <g id="track2" transform="translate(1400, 18)">
        <!-- Python -->
        <g transform="translate(10, 0)">
          <rect width="105" height="36" rx="18" fill="#0f1f38" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
          <text x="32" y="23" fill="#bae6fd" class="font-tech" font-size="12.5" font-weight="700">Python 3.12</text>
        </g>

        <!-- Azure OpenAI -->
        <g transform="translate(130, 0)">
          <rect width="135" height="36" rx="18" fill="#171e3b" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#818cf8"/>
          <text x="32" y="23" fill="#c7d2fe" class="font-tech" font-size="12.5" font-weight="700">Azure OpenAI</text>
        </g>

        <!-- FastAPI -->
        <g transform="translate(280, 0)">
          <rect width="95" height="36" rx="18" fill="#062e24" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#34d399"/>
          <text x="32" y="23" fill="#a7f3d0" class="font-tech" font-size="12.5" font-weight="700">FastAPI</text>
        </g>

        <!-- RAG & Agents -->
        <g transform="translate(390, 0)">
          <rect width="138" height="36" rx="18" fill="#2d133b" stroke="#e879f9" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#e879f9"/>
          <text x="32" y="23" fill="#f5d0fe" class="font-tech" font-size="12.5" font-weight="700">RAG &amp; Agents</text>
        </g>

        <!-- Qdrant Vector DB -->
        <g transform="translate(543, 0)">
          <rect width="128" height="36" rx="18" fill="#31131a" stroke="#f43f5e" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#f43f5e"/>
          <text x="32" y="23" fill="#fecdd3" class="font-tech" font-size="12.5" font-weight="700">Qdrant DB</text>
        </g>

        <!-- PyTorch -->
        <g transform="translate(686, 0)">
          <rect width="98" height="36" rx="18" fill="#331811" stroke="#fb923c" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#fb923c"/>
          <text x="32" y="23" fill="#ffedd5" class="font-tech" font-size="12.5" font-weight="700">PyTorch</text>
        </g>

        <!-- Docker -->
        <g transform="translate(799, 0)">
          <rect width="92" height="36" rx="18" fill="#0f243d" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#60a5fa"/>
          <text x="32" y="23" fill="#bfdbfe" class="font-tech" font-size="12.5" font-weight="700">Docker</text>
        </g>

        <!-- React.js -->
        <g transform="translate(906, 0)">
          <rect width="98" height="36" rx="18" fill="#082b36" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#22d3ee"/>
          <text x="32" y="23" fill="#cffafe" class="font-tech" font-size="12.5" font-weight="700">React.js</text>
        </g>

        <!-- PostgreSQL -->
        <g transform="translate(1019, 0)">
          <rect width="118" height="36" rx="18" fill="#132338" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
          <text x="32" y="23" fill="#bae6fd" class="font-tech" font-size="12.5" font-weight="700">PostgreSQL</text>
        </g>

        <!-- Redis -->
        <g transform="translate(1152, 0)">
          <rect width="84" height="36" rx="18" fill="#341214" stroke="#ef4444" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
          <text x="32" y="23" fill="#fee2e2" class="font-tech" font-size="12.5" font-weight="700">Redis</text>
        </g>

        <!-- LangChain -->
        <g transform="translate(1251, 0)">
          <rect width="112" height="36" rx="18" fill="#0d2b24" stroke="#10b981" stroke-opacity="0.7" stroke-width="1.2"/>
          <circle cx="20" cy="18" r="4.5" fill="#10b981"/>
          <text x="32" y="23" fill="#d1fae5" class="font-tech" font-size="12.5" font-weight="700">LangChain</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Edge Fade Overlays (Non-blocking and safe) -->
  <rect x="0" y="0" width="60" height="72" rx="14" fill="url(#edgeLeftFade)" pointer-events="none"/>
  <rect x="1140" y="0" width="60" height="72" rx="14" fill="url(#edgeRightFade)" pointer-events="none"/>
</svg>
